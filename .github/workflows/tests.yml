name: Tests

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt runtime library
        run: sudo apt-get update && sudo apt-get install --yes libegl1

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -v

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install quality toolchain
        run: python -m pip install -r requirements.txt -r requirements-quality.txt

      - name: Check formatting
        run: ruff format --check wolflauncher tests main.py scripts/render-windows-icon.py

      - name: Lint
        run: ruff check wolflauncher tests main.py scripts/render-windows-icon.py

      - name: Type-check hardened core boundaries
        run: mypy wolflauncher/paths.py wolflauncher/persistence.py wolflauncher/redaction.py wolflauncher/secret_store.py

      - name: Audit locked release dependencies
        run: pip-audit -r requirements-release.txt

      - name: Compile and check whitespace
        run: |
          python -m compileall -q main.py wolflauncher scripts
          git diff --check

  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.10"
            label: ubuntu22
          - os: ubuntu-24.04
            python: "3.12"
            label: ubuntu24
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install build inputs
        run: |
          python -m pip install -r requirements-release.txt -r requirements-dev.txt

      - name: Build wheel and Debian package
        env:
          PYTHON: python
          WOLFLAUNCHER_ARTIFACT_LABEL: ${{ matrix.label }}
        run: ./scripts/build-deb.sh

      - name: Install declared GUI runtime dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1

      - name: Inspect and smoke-test extracted package
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          package_path=$(find dist -maxdepth 1 -name 'wolflauncher_*.deb' -print -quit)
          test -n "$package_path"
          dpkg-deb --info "$package_path"
          mkdir package-root
          dpkg-deb --extract "$package_path" package-root
          export WOLFLAUNCHER_SHARE_ROOT="$PWD/package-root/usr/share/wolflauncher"
          export PYTHONPATH="$PWD/package-root/usr/lib/wolflauncher/python"
          export PATH="$PWD/package-root/usr/lib/wolflauncher/node-runtime/bin:$PWD/package-root/usr/lib/wolflauncher/node/node_modules/.bin:$PATH"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/wolflauncher-smoke/config"
          export XDG_DATA_HOME="$RUNNER_TEMP/wolflauncher-smoke/data"
          python -c "import wolflauncher; from wolflauncher import config; assert config.EXAMPLE_SERVERS_PATH.is_file(); assert config.VENDORED_LAUNCHER_PATH.is_file()"
          node -e "const p=require('./package-root/usr/lib/wolflauncher/node/node_modules/gamedig/package.json'); if(p.version !== '5.3.3') process.exit(1)"
          python - <<'PY'
          from PySide6.QtCore import QTimer
          from PySide6.QtWidgets import QApplication

          from wolflauncher import __version__
          from wolflauncher.app import MainWindow
          from wolflauncher.theme import apply_application_theme

          app = QApplication([])
          app.setApplicationName("WolfLauncher")
          app.setApplicationVersion(__version__)
          app.setOrganizationName("WolfLauncher")
          apply_application_theme(app)
          window = MainWindow()
          window.show()
          QTimer.singleShot(1000, window.close)
          QTimer.singleShot(15000, lambda: app.exit(124))
          exit_code = app.exec()
          if exit_code != 0:
              raise SystemExit(exit_code)
          PY
          (cd dist && sha256sum --check *.deb.sha256)

      - name: Upload release-candidate artifacts
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wolflauncher-debian-${{ matrix.label }}-${{ github.sha }}
          path: |
            dist/*.deb
            dist/*.deb.sha256
            dist/*.whl
          if-no-files-found: error

  windows-package:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up bundled Node.js runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: packaging/npm/package-lock.json

      - name: Install Python build inputs
        run: python -m pip install -r requirements-windows-release.txt -r requirements-dev.txt

      - name: Run Windows unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -v

      - name: Build and smoke-test portable Windows artifact
        shell: powershell
        run: .\scripts\build-windows.ps1 -Python python -Npm npm -Node node -ArtifactLabel windows-x64

      - name: Upload portable Windows release-candidate artifact
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wolflauncher-windows-portable-${{ github.sha }}
          path: |
            dist/windows/*.zip
            dist/windows/*.zip.sha256
          if-no-files-found: error

      - name: Install verified Inno Setup compiler
        shell: powershell
        run: |
          $iscc = .\scripts\install-inno-setup.ps1 -DestinationRoot "$env:RUNNER_TEMP\inno-setup"
          "WOLFLAUNCHER_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and smoke-test Windows installer
        shell: powershell
        run: |
          .\scripts\build-windows-installer.ps1 -Iscc $env:WOLFLAUNCHER_ISCC -Python python -ArtifactLabel windows-x64
          $installer = Get-Item "dist\windows\wolflauncher-*-setup-windows-x64.exe"
          .\scripts\test-windows-installer.ps1 -InstallerPath $installer.FullName

      - name: Upload Windows installer release-candidate artifact
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wolflauncher-windows-installer-${{ github.sha }}
          path: |
            dist/windows/*-setup-*.exe
            dist/windows/*-setup-*.exe.sha256
          if-no-files-found: error
