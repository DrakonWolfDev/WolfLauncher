name: Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  release-preflight:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Resolve and validate version
        id: version
        env:
          SITE_TOKEN: ${{ secrets.WOLF_FORGE_SITE_TOKEN }}
        run: |
          version="$(python3 -c 'from wolflauncher import __version__; print(__version__)')"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$version" || {
              echo "Tag $GITHUB_REF_NAME does not match WolfLauncher version $version." >&2
              exit 1
            }
            test -n "$SITE_TOKEN" || {
              echo "WOLF_FORGE_SITE_TOKEN is required before publishing." >&2
              exit 1
            }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  lint:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Run shellcheck on installer scripts
        run: >-
          shellcheck -S warning
          scripts/wolflauncher-install.sh
          scripts/wolflauncher-uninstall.sh
          scripts/build-linux-installer.sh

  unit-tests:
    name: Installer unit tests
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run installer smoke tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest tests.test_installer_scripts -v

  bundle:
    name: Build installer release bundle
    needs: [release-preflight, lint, unit-tests, smoke-install]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Build complete installer source archive
        env:
          version: ${{ needs.release-preflight.outputs.version }}
        run: |
          python3 -m pip install -r requirements-dev.txt
          python3 -m build --sdist --no-isolation
          cp "dist/wolflauncher-${version}.tar.gz" "wolflauncher-${version}-installer-source.tar.gz"
          sha256sum "wolflauncher-${version}-installer-source.tar.gz" > "wolflauncher-${version}-installer-source.tar.gz.sha256"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libxcb-cursor0 libxkbcommon0 libdbus-1-3 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libgl1 rpm

      - name: Build AppImage-backed user installer
        run: |
          python3 -m pip install -r requirements.txt -r requirements-appimage.txt
          ./scripts/build-linux-installer.sh

      - name: Build DEB and RPM packages
        env:
          PYTHON: python3
          WOLFLAUNCHER_ARTIFACT_LABEL: ubuntu24
          WOLFLAUNCHER_REUSE_APPDIR: "1"
        run: |
          bash scripts/build-deb.sh
          bash scripts/build-rpm.sh

      - name: Verify RPM installation, startup and removal on Fedora 44
        run: |
          docker run --rm -v "$PWD/dist:/packages:ro" fedora:44 bash -euxc '
            dnf install -y /packages/*.rpm
            rpm -q wolflauncher
            QT_QPA_PLATFORM=offscreen WOLFLAUNCHER_SMOKE_TEST=1 wolflauncher
            dnf remove -y wolflauncher
            test ! -e /usr/bin/wolflauncher
          '
      - name: Publish installer source archive as workflow artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wolflauncher-release-linux-${{ github.sha }}
          path: |
            dist/*.deb
            dist/*.deb.sha256
            dist/*.rpm
            dist/*.rpm.sha256
            dist/WolfLauncher-*-x86_64.AppImage
            dist/WolfLauncher-*-x86_64.AppImage.sha256
            dist/WolfLauncher-*-linux-x86_64-installer.tar.gz
            dist/WolfLauncher-*-linux-x86_64-installer.tar.gz.sha256
            wolflauncher-*-installer-source.tar.gz
            wolflauncher-*-installer-source.tar.gz.sha256
          if-no-files-found: error

  windows-release:
    name: Build Windows release bundle
    needs: [release-preflight, lint, unit-tests]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up bundled Node.js runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: packaging/npm/package-lock.json

      - name: Install build inputs
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements-windows-release.txt

      - name: Run Windows unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -v

      - name: Build and smoke-test portable Windows artifact
        shell: powershell
        run: .\scripts\build-windows.ps1 -Python python -Npm npm -Node node -ArtifactLabel windows-x64

      - name: Install verified Inno Setup compiler
        shell: powershell
        run: |
          $iscc = .\scripts\install-inno-setup.ps1 -DestinationRoot "$env:RUNNER_TEMP\inno-setup"
          "WOLFLAUNCHER_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and smoke-test Windows installer
        shell: powershell
        run: |
          .\scripts\build-windows-installer.ps1 -Iscc $env:WOLFLAUNCHER_ISCC -Python python -ArtifactLabel windows-x64
          $installer = Get-Item "dist\windows\wolflauncher-*-setup-windows-x64.exe"
          .\scripts\test-windows-installer.ps1 -InstallerPath $installer.FullName

      - name: Publish Windows workflow artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wolflauncher-release-windows-${{ github.sha }}
          path: |
            dist/windows/*.zip
            dist/windows/*.zip.sha256
            dist/windows/*-setup-*.exe
            dist/windows/*-setup-*.exe.sha256
          if-no-files-found: error

  publish:
    name: Publish complete desktop release
    needs: [release-preflight, bundle, windows-release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release-preflight.outputs.version }}
    steps:
      - name: Download complete release set
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: wolflauncher-release-*-${{ github.sha }}
          path: release
          merge-multiple: true

      - name: Verify required platform artifacts
        run: |
          test -f "release/wolflauncher-${VERSION}-setup-windows-x64.exe"
          test -f "release/WolfLauncher-${VERSION}-linux-x86_64-installer.tar.gz"
          test -f "release/wolflauncher_${VERSION}_ubuntu24_amd64.deb"
          test -f "release/wolflauncher-${VERSION}-1.x86_64.rpm"
          test -f "release/WolfLauncher-${VERSION}-x86_64.AppImage"
          test -f "release/wolflauncher-${VERSION}-installer-source.tar.gz"
          (cd release && sha256sum --check *.sha256)

      - name: Publish one GitHub prerelease
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: |
            release/*.deb
            release/*.deb.sha256
            release/*.rpm
            release/*.rpm.sha256
            release/*.AppImage
            release/*.AppImage.sha256
            release/WolfLauncher-${{ needs.release-preflight.outputs.version }}-linux-x86_64-installer.tar.gz
            release/WolfLauncher-${{ needs.release-preflight.outputs.version }}-linux-x86_64-installer.tar.gz.sha256
            release/wolflauncher-${{ needs.release-preflight.outputs.version }}-setup-windows-x64.exe
            release/wolflauncher-${{ needs.release-preflight.outputs.version }}-setup-windows-x64.exe.sha256
            release/wolflauncher-${{ needs.release-preflight.outputs.version }}-windows-x64.zip
            release/wolflauncher-${{ needs.release-preflight.outputs.version }}-windows-x64.zip.sha256
            release/wolflauncher-${{ needs.release-preflight.outputs.version }}-installer-source.tar.gz
            release/wolflauncher-${{ needs.release-preflight.outputs.version }}-installer-source.tar.gz.sha256
          fail_on_unmatched_files: true

      - name: Request website manifest update
        env:
          GH_TOKEN: ${{ secrets.WOLF_FORGE_SITE_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          payload = {
              "event_type": "desktop_release_published",
              "client_payload": {
                  "project": "wolf_launcher",
                  "version": version,
                  "tag": f"v{version}",
                  "artifacts": {
                      "windows": f"wolflauncher-{version}-setup-windows-x64.exe",
                      "linux_deb": f"wolflauncher_{version}_ubuntu24_amd64.deb",
                      "linux_rpm": f"wolflauncher-{version}-1.x86_64.rpm",
                      "linux_appimage": f"WolfLauncher-{version}-x86_64.AppImage",
                  },
              },
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "website-release.json"
          path.write_text(json.dumps(payload), encoding="utf-8")
          PY
          gh api --method POST repos/DrakonWolfDev/wolf-forge-static/dispatches --input "$RUNNER_TEMP/website-release.json"

  smoke-install:
    name: Smoke install on ${{ matrix.label }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: ubuntu22
            python: "3.10"
          - os: ubuntu-24.04
            label: ubuntu24
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install Qt runtime library
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libxcb-cursor0 libxkbcommon0 libdbus-1-3 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libgl1 rpm

      - name: Run installer into a sandbox prefix
        env:
          QT_QPA_PLATFORM: offscreen
          WOLFLAUNCHER_ASSUME_YES: "1"
          # Don't try to fetch Node/GameDig from the network in CI.
          WOLFLAUNCHER_SKIP_NODE: "1"
          WOLFLAUNCHER_SKIP_GAMEDIG: "1"
          WOLFLAUNCHER_SKIP_VERIFY: "1"
          HOME: ${{ runner.temp }}/wl-smoke-home
        run: |
          mkdir -p "${HOME}"
          ./scripts/wolflauncher-install.sh

      - name: Confirm the launcher reaches PySide6 and the Qt event loop
        env:
          QT_QPA_PLATFORM: offscreen
          HOME: ${{ runner.temp }}/wl-smoke-home
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          test -x "${HOME}/.local/bin/wolflauncher"
          python - <<'PY'
          import os, sys
          py_dir = os.path.join(os.environ["HOME"], ".local", "share",
                                "wolflauncher", "runtime", "python")
          os.environ["WOLFLAUNCHER_SHARE_ROOT"] = os.path.join(os.path.dirname(py_dir), "share")
          sys.path.insert(0, py_dir)
          from PySide6.QtCore import QTimer
          from PySide6.QtWidgets import QApplication
          from wolflauncher import __version__, config
          assert config.EXAMPLE_SERVERS_PATH.is_file(), "example.servers.yaml missing"
          app = QApplication([])
          QTimer.singleShot(500, app.quit)
          app.exec()
          print("WolfLauncher", __version__, "GUI smoke OK")
          PY

      - name: Run uninstaller and confirm user-local cleanup
        env:
          HOME: ${{ runner.temp }}/wl-smoke-home
        run: |
          ./scripts/wolflauncher-uninstall.sh
          test ! -d "${HOME}/.local/share/wolflauncher/runtime"
          test ! -e "${HOME}/.local/bin/wolflauncher"
