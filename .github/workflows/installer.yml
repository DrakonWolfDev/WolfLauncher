name: Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  lint:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Run shellcheck on installer scripts
        run: shellcheck -S warning scripts/wolflauncher-install.sh scripts/wolflauncher-uninstall.sh

  unit-tests:
    name: Installer unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run installer smoke tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest tests.test_installer_scripts -v

  bundle:
    permissions:
      contents: write
    name: Build installer release bundle
    needs: [lint, unit-tests, smoke-install]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Resolve version
        id: version
        run: |
          version="$(python3 -c 'from wolflauncher import __version__; print(__version__)')"
          # Normalise 0.9.0b1 -> 0.9.0b1 (keep as-is; deb uses ~dev0 but the
          # installer tarball matches the in-tree __version__).
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build complete installer source archive
        env:
          version: ${{ steps.version.outputs.version }}
        run: |
          python3 -m pip install -r requirements-dev.txt
          python3 -m build --sdist --no-isolation
          cp "dist/wolflauncher-${version}.tar.gz" "wolflauncher-${version}-installer-source.tar.gz"
          sha256sum "wolflauncher-${version}-installer-source.tar.gz" > "wolflauncher-${version}-installer-source.tar.gz.sha256"

      - name: Publish installer source archive as workflow artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wolflauncher-installer-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            wolflauncher-*-installer-source.tar.gz
            wolflauncher-*-installer-source.tar.gz.sha256
          if-no-files-found: error

      - name: Upload installer bundle to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: false
          files: |
            wolflauncher-*-installer-source.tar.gz
            wolflauncher-*-installer-source.tar.gz.sha256
          fail_on_unmatched_files: true

  smoke-install:
    name: Smoke install on ${{ matrix.label }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: ubuntu22
            python: "3.10"
          - os: ubuntu-24.04
            label: ubuntu24
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install Qt runtime library
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libxcb-cursor0 libxkbcommon0 libdbus-1-3

      - name: Run installer into a sandbox prefix
        env:
          QT_QPA_PLATFORM: offscreen
          WOLFLAUNCHER_ASSUME_YES: "1"
          # Don't try to fetch Node/GameDig from the network in CI.
          WOLFLAUNCHER_SKIP_NODE: "1"
          WOLFLAUNCHER_SKIP_GAMEDIG: "1"
          WOLFLAUNCHER_SKIP_VERIFY: "1"
          HOME: ${{ runner.temp }}/wl-smoke-home
        run: |
          mkdir -p "${HOME}"
          ./scripts/wolflauncher-install.sh

      - name: Confirm the launcher reaches PySide6 and the Qt event loop
        env:
          QT_QPA_PLATFORM: offscreen
          HOME: ${{ runner.temp }}/wl-smoke-home
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          test -x "${HOME}/.local/bin/wolflauncher"
          python - <<'PY'
          import os, sys
          py_dir = os.path.join(os.environ["HOME"], ".local", "share",
                                "wolflauncher", "runtime", "python")
          os.environ["WOLFLAUNCHER_SHARE_ROOT"] = os.path.join(os.path.dirname(py_dir), "share")
          sys.path.insert(0, py_dir)
          from PySide6.QtCore import QTimer
          from PySide6.QtWidgets import QApplication
          from wolflauncher import __version__, config
          assert config.EXAMPLE_SERVERS_PATH.is_file(), "example.servers.yaml missing"
          app = QApplication([])
          QTimer.singleShot(500, app.quit)
          app.exec()
          print("WolfLauncher", __version__, "GUI smoke OK")
          PY

      - name: Run uninstaller and confirm user-local cleanup
        env:
          HOME: ${{ runner.temp }}/wl-smoke-home
        run: |
          ./scripts/wolflauncher-uninstall.sh
          test ! -d "${HOME}/.local/share/wolflauncher/runtime"
          test ! -e "${HOME}/.local/bin/wolflauncher"
